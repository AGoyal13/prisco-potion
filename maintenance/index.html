<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Temporarily Unavailable</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 600px at 50% -10%, #1a1a1a 0%, #0d0d0d 60%, #070707 100%);
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 48px 36px;
      backdrop-filter: blur(8px);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(220, 60, 60, 0.12);
      border: 1px solid rgba(220, 60, 60, 0.35);
      font-size: 30px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 14px;
      color: #fff;
    }
    p { color: #b8b8b8; font-size: 1rem; }
    p + p { margin-top: 14px; }
    .reason {
      margin-top: 28px;
      padding: 14px 18px;
      background: rgba(220, 60, 60, 0.08);
      border: 1px solid rgba(220, 60, 60, 0.25);
      border-radius: 12px;
      color: #f0c6c6;
      font-size: 0.95rem;
    }
    .reason strong { color: #ff8f8f; font-weight: 600; }
    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 0.85rem;
      color: #7a7a7a;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">⚠️</div>
    <h1>Site Temporarily Unavailable</h1>
    <p>This site has been temporarily put down. Please visit Cloudflare for next steps.</p>
    <div class="reason">
      Reason: <strong>Non-payment of dues</strong>
    </div>
    <div class="footer">
      We apologise for the inconvenience. Service will be restored once the matter is resolved.
    </div>
  </main>
</body>
</html>
